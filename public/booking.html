<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Запись на звонок — Calendar</title>
  <meta name="description" content="Выберите тип события и удобное время для звонка.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <svg class="brand-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4.5" width="18" height="16.5" rx="3"></rect>
          <path d="M3 9.5h18"></path>
          <path d="M8 2.5v4M16 2.5v4"></path>
          <circle cx="12" cy="15" r="3.4"></circle>
          <path d="M12 13.4V15l1.3.9"></path>
        </svg>
        <span class="brand-name">Calendar</span>
      </a>
      <nav class="header-nav" aria-label="Основная навигация">
        <a class="header-link" href="booking.html" aria-current="page">Записаться</a>
        <a class="header-link" href="admin.html">Админка</a>
      </nav>
    </div>
  </header>

  <main class="container booking">
    <a class="back-link" href="index.html">← На главную</a>

    <ol class="stepper" aria-label="Шаги записи">
      <li class="step is-active" id="step-type" aria-current="step">Тип</li>
      <li class="step" id="step-time">Время</li>
      <li class="step is-future" id="step-data">Данные</li>
      <li class="step is-future" id="step-confirm">Подтверждение</li>
    </ol>

    <section id="type-step" aria-labelledby="type-title">
      <h1 class="booking-title" id="type-title">Выберите тип события</h1>
      <p class="lead">Нажмите на карточку, чтобы открыть календарь и выбрать удобный слот.</p>
      <p id="type-error" class="admin-error" hidden></p>
      <p id="types-empty" class="empty-state" hidden>Типов событий ещё нет</p>
      <div id="type-grid" class="type-grid"></div>
    </section>

    <section id="time-step" aria-labelledby="time-title" hidden>
      <h1 class="booking-title" id="time-title">Выберите время</h1>
      <p id="selected-type" class="lead"></p>
      <button type="button" id="back-to-types" class="back-button">← Другой тип</button>
      <p id="slots-error" class="admin-error" hidden></p>
      <p id="slots-empty" class="empty-state" hidden>Свободных слотов на ближайшие дни нет</p>
      <div id="calendar" class="calendar" hidden>
        <p id="window-range" class="window-range"></p>
        <div class="days-nav">
          <button type="button" id="prev-days" class="days-arrow" aria-label="Предыдущие дни">‹</button>
          <div id="days" class="days" role="group" aria-label="Дни записи"></div>
          <button type="button" id="next-days" class="days-arrow" aria-label="Следующие дни">›</button>
        </div>
        <p id="day-slots-title" class="day-slots-title"></p>
        <div id="day-slots" class="slot-list" role="group" aria-label="Слоты выбранного дня"></div>
        <p id="timezone-note" class="timezone-note"></p>
      </div>
    </section>
  </main>

  <script type="module" src="assets/booking.js"></script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Выберите тип события — Calendar</title>
  <meta name="description" content="Выберите тип события, чтобы открыть календарь и выбрать удобный слот.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <svg class="brand-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4.5" width="18" height="16.5" rx="3"></rect>
          <path d="M3 9.5h18"></path>
          <path d="M8 2.5v4M16 2.5v4"></path>
          <circle cx="12" cy="15" r="3.4"></circle>
          <path d="M12 13.4V15l1.3.9"></path>
        </svg>
        <span class="brand-name">Calendar</span>
      </a>
      <a class="header-link" href="booking.html">Записаться</a>
    </div>
  </header>

  <main class="container booking">
    <a class="back-link" href="index.html">← На главную</a>

    <div class="card host-card">
      <span class="host-avatar" aria-hidden="true">T</span>
      <div class="host-meta">
        <p class="host-name">Tota</p>
        <p class="host-role">Host</p>
      </div>
    </div>

    <h1 class="booking-title">Выберите тип события</h1>
    <p class="lead">Нажмите на карточку, чтобы открыть календарь и выбрать удобный слот.</p>

    <div class="type-grid">
      <article class="card type-card">
        <div class="type-head">
          <h2>Встреча 15 минут</h2>
          <span class="badge">15 мин</span>
        </div>
        <p>Короткий тип события для быстрого слота.</p>
      </article>

      <article class="card type-card">
        <div class="type-head">
          <h2>Встреча 30 минут</h2>
          <span class="badge">30 мин</span>
        </div>
        <p>Базовый тип события для бронирования.</p>
      </article>
    </div>
  </main>
</body>
</html>
